    <script>
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('home-automation-state') || '{}');
          var theme = stored?.state?.preferences?.theme || 'system';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
